// Purpose:         gRPC contract of the consensus service: three replicas
//                  compute a + b independently and the Raft cluster commits
//                  the majority result, which must match the Peano result.
// Related Docs:    CLAUDE.md (sections 1, 3, 4.3), contracts/proto/README.md,
//                  ADR-0020

syntax = "proto3";

package aaas.consensus.v1;

// ConsensusService verifies a Peano result by majority vote. The saga calls
// it once per task, after the successor loop has finished.
service ConsensusService {
  // Vote asks every replica to compute a + b, commits the majority result
  // through Raft and compares it with the candidate.
  //
  // A disagreement with the candidate is a successful response with
  // accepted set to false; the saga then fails the task. When no majority
  // can be formed (fewer than two replicas agree, or fewer than two answer
  // in time), the call yields the gRPC status UNAVAILABLE.
  rpc Vote(VoteRequest) returns (VoteResponse);
}

// VoteRequest carries the addition and the result to verify.
message VoteRequest {
  // Task identifier (UUIDv7, canonical text form); repeated votes for the
  // same task return the result committed the first time.
  string task_id = 1;
  // First operand, in 0..99 999.
  uint32 a = 2;
  // Second operand, in 0..99 999.
  uint32 b = 3;
  // Result computed by the Peano loop, in 0..199 998.
  uint32 candidate = 4;
}

// VoteResponse carries the committed majority result and the ballots.
message VoteResponse {
  // True when the majority result equals the candidate.
  bool accepted = 1;
  // Majority result committed through Raft, in 0..199 998.
  uint32 result = 2;
  // One ballot per replica that answered, in no particular order.
  repeated ReplicaVote votes = 3;
}

// ReplicaVote is the ballot of one replica.
message ReplicaVote {
  // Replica name, for example "consensus-replica-cobol".
  string replica = 1;
  // a + b as computed by that replica, in 0..199 998.
  uint32 result = 2;
}
