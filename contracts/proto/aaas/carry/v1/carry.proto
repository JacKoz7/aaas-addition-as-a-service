// Owning Team:     Arithmetic Excellence Center (AEC)
// Classification:  INTERNAL
// Purpose:         gRPC contract of the carry service: propagates a carry
//                  of one to the higher decimal positions of a number.
// Related Docs:    CLAUDE.md (sections 3, 4.3, 4.4), contracts/proto/README.md,
//                  ADR-0020

syntax = "proto3";

package aaas.carry.v1;

// CarryService is called by the successor service when a digit service
// reports a carry (digit 9 wrapped to 0). It adds one at the given position,
// asking the digit service of each visited digit for its successor, and
// continues upwards while digits keep wrapping.
service CarryService {
  // Propagate adds one at digits[position] and propagates further carries.
  //
  // Example: for 999 + 1, the units digit wraps from 9 to 0 and the
  // successor service sends digits [0, 9, 9] with position 1; the response
  // is [0, 0, 0, 1], that is 1000. A position greater than the number of digits, or a digit outside
  // 0..9, yields the gRPC status INVALID_ARGUMENT. An unreachable digit
  // service yields UNAVAILABLE.
  rpc Propagate(PropagateRequest) returns (PropagateResponse);
}

// PropagateRequest carries a number as decimal digits and the position that
// receives the carry.
message PropagateRequest {
  // Decimal digits of the number, least significant first (index 0 is the
  // units digit); each in 0..9, at most 6 digits.
  repeated uint32 digits = 1;
  // Index of the digit that receives the carry, in 0..len(digits). When it
  // equals len(digits), a new most significant digit 1 is appended.
  uint32 position = 2;
  // Task identifier (UUIDv7, canonical text form) of the addition, carried
  // into the event aaas.carry.propagated.v1. A missing or malformed task_id
  // yields the gRPC status INVALID_ARGUMENT.
  string task_id = 3;
}

// PropagateResponse carries the number after the carry was applied.
message PropagateResponse {
  // Decimal digits of the result, least significant first; one element
  // longer than the request when the carry passed the highest digit.
  repeated uint32 digits = 1;
}
