// Owning Team:     Arithmetic Excellence Center (AEC)
// Classification:  INTERNAL
// Purpose:         gRPC contract of the successor service: computes n + 1,
//                  the only arithmetic primitive of Peano addition.
// Related Docs:    CLAUDE.md (sections 1, 3, 4.3), contracts/proto/README.md,
//                  ADR-0016, ADR-0020

syntax = "proto3";

package aaas.successor.v1;

// SuccessorService computes the successor of a natural number by querying
// the digit services and, on a carry, the carry service. The saga calls it
// b times to compute a + b.
service SuccessorService {
  // Next returns n + 1.
  //
  // An n outside 0..199 997 yields the gRPC status OUT_OF_RANGE (the largest
  // possible sum is 99 999 + 99 999 = 199 998). An unreachable digit or carry
  // service yields UNAVAILABLE.
  rpc Next(NextRequest) returns (NextResponse);
}

// NextRequest carries the number whose successor is requested and the task
// the call belongs to.
message NextRequest {
  // Natural number in 0..199 997.
  uint32 n = 1;
  // Task identifier (UUIDv7, canonical text form). An addition asks for the
  // successor of each value from a to a + b - 1 exactly once, so
  // (task_id, n) identifies a call: a retried call is answered from the
  // call log without a second log entry or event (ADR-0016). A missing or
  // malformed task_id yields the gRPC status INVALID_ARGUMENT.
  string task_id = 2;
}

// NextResponse carries the successor.
message NextResponse {
  // n + 1, in 1..199 998.
  uint32 n = 1;
}
